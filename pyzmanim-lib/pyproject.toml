[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzmanim"
version = "0.1.0"
description = "Python port of the vbzmanim Hebrew calendar / zmanim library (https://github.com/diaphone1/vbzmanim)"
requires-python = ">=3.10"
license = { text = "LGPL-2.1" }

[tool.setuptools.packages.find]
include = ["pyzmanim*"]
